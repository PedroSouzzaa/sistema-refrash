<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acesso Restrito</title>
    <style>
        body { font-family: sans-serif; background: #1a252f; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 12px; width: 300px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Painel Admin</h2>
        <input type="text" id="u" placeholder="Usuário">
        <input type="password" id="p" placeholder="Senha">
        <button onclick="logar()">Entrar</button>
    </div>
    <script>
        async function logar() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ user: document.getElementById('u').value, password: document.getElementById('p').value })
            });
            if(res.ok) window.location.href = '/admin';
            else alert("Acesso Negado");
        }
    </script>
</body>
</html>
