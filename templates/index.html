<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Check-in Refresh</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; touch-action: manipulation; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 8px; font-size: 16px; box-sizing: border-box; background: #fff; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
        .kiosk-btn { position: fixed; top: 10px; right: 10px; opacity: 0.3; background: #000; color: #fff; border: none; padding: 5px; border-radius: 5px; font-size: 10px; }
    </style>
</head>
<body oncontextmenu="return false;">

    <button class="kiosk-btn" id="lockBtn" onclick="ativarModoKiosk()">LOCK SCREEN</button>

    <div class="card">
        <h1 style="color: #007bff; margin-bottom: 5px;">Refresh</h1>
        <p style="color: #666; margin-bottom: 20px;">Selecione seu turno e valide o código</p>
        
        <select id="turno">
            <option value="" disabled selected>Selecione seu Turno</option>
            <option value="Manhã (07h - 16h40)">Manhã (07h às 16h40)</option>
            <option value="Tarde (13h - 22h)">Tarde (13h às 22h)</option>
            <option value="Noite (22h - 07h)">Noite (22h às 07h)</option>
        </select>

        <input type="text" id="user" placeholder="Seu ID de Usuário" autocomplete="off">
        <input type="password" id="code" placeholder="Código Único" autocomplete="off">
        
        <button id="btnValidar" onclick="validar()">Confirmar Presença</button>
    </div>

    <script>
        let wakeLock = null;

        async function ativarModoKiosk() {
            try {
                if (!document.fullscreenElement) {
                    await document.documentElement.requestFullscreen();
                }
                if ('wakeLock' in navigator) {
                    wakeLock = await navigator.wakeLock.request('screen');
                }
                document.getElementById('lockBtn').style.display = 'none';
            } catch (err) { console.log(err); }
        }

        // Tenta manter tela cheia se alguém tentar sair
        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                // Opcional: alert("O modo Totem foi desativado!");
            }
        });

        async function validar() {
            const btn = document.getElementById('btnValidar');
            const payload = {
                usuario: document.getElementById('user').value,
                codigo: document.getElementById('code').value,
                turno: document.getElementById('turno').value
            };

            if(!payload.turno || !payload.usuario || !payload.codigo) {
                alert("Por favor, preencha todos os campos e selecione o turno.");
                return;
            }

            btn.disabled = true;
            try {
                const res = await fetch('/colaborador/validar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                alert(data.msg);
                if(res.ok) document.getElementById('code').value = '';
            } catch (e) { alert("Erro de conexão."); }
            btn.disabled = false;
        }
    </script>
</body>
</html>
