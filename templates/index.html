<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Refresh</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 90%; max-width: 400px; text-align: center; }
        input, select { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="color: #007bff;">Refresh</h1>
        
        <select id="portaria">
            <option value="" disabled selected>Onde você está?</option>
            <option value="P1">Portaria 1 (P1)</option>
            <option value="P2">Portaria 2 (P2)</option>
        </select>

        <select id="turno">
            <option value="" disabled selected>Selecione seu Turno</option>
            <option value="Manhã">Manhã (07h às 16h40)</option>
            <option value="Tarde">Tarde (13h às 22h)</option>
            <option value="Noite">Noite (22h às 07h)</option>
        </select>

        <input type="text" id="user" placeholder="ID de Usuário" autocomplete="off">
        <input type="password" id="code" placeholder="Código Único" autocomplete="off">
        
        <button id="btnValidar" onclick="validar()">Confirmar Presença</button>
    </div>

    <script>
        async function validar() {
            const payload = {
                usuario: document.getElementById('user').value.trim(),
                codigo: document.getElementById('code').value.trim(),
                turno: document.getElementById('turno').value,
                portaria: document.getElementById('portaria').value
            };

            if(!payload.portaria || !payload.turno || !payload.usuario || !payload.codigo) {
                alert("Preencha todos os campos.");
                return;
            }

            try {
                const res = await fetch('/colaborador/validar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                alert(data.msg);
                if(res.ok) document.getElementById('code').value = '';
            } catch (e) { alert("Erro de conexão."); }
        }
    </script>
</body>
</html>
