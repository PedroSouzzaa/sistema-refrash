<div style="position: fixed; top: 10px; right: 10px; z-index: 1000;">
    <button id="btnConfig" onclick="ativarModoKiosk()" style="background: rgba(0,0,0,0.5); color: white; border: none; padding: 8px; border-radius: 5px; cursor: pointer;">
        🖥️ Modo Totem (Tela Cheia)
    </button>
</div>

<script>
let wakeLock = null;

// Função principal para ativar tela cheia e bloquear o repouso
async function ativarModoKiosk() {
    try {
        // 1. Ativar Tela Cheia
        if (!document.fullscreenElement) {
            await document.documentElement.requestFullscreen();
        }

        // 2. Bloquear inatividade (Wake Lock)
        if ('wakeLock' in navigator) {
            await solicitarWakeLock();
        } else {
            console.warn("Wake Lock não suportado neste navegador.");
            alert("Atenção: Este navegador não suporta manter a tela acesa automaticamente.");
        }
    } catch (err) {
        console.error(`Erro: ${err.message}`);
    }
}

// Função para solicitar o bloqueio de repouso da tela
async function solicitarWakeLock() {
    try {
        wakeLock = await navigator.wakeLock.request('screen');
        
        // Se o bloqueio for liberado (ex: o usuário minimizar a aba), tenta reativar
        wakeLock.addEventListener('release', () => {
            console.log('Wake Lock liberado.');
        });
        
        alert("Modo Totem Ativado: Tela cheia e sempre acesa.");
        document.getElementById('btnConfig').style.display = 'none'; // Esconde o botão após ativar
    } catch (err) {
        console.error(`${err.name}, ${err.message}`);
    }
}

// Reativar Wake Lock se a página voltar a ficar visível (caso mude de aba e volte)
document.addEventListener('visibilitychange', async () => {
    if (wakeLock !== null && document.visibilityState === 'visible') {
        await solicitarWakeLock();
    }
});
</script>
