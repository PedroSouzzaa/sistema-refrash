<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in Refresh</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 350px; text-align: center; }
        input { width: 100%; padding: 15px; margin: 10px 0; border: 2px solid #eee; border-radius: 8px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #007bff; color: white; border: none; border-radius: 8px; font-size: 18px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h1 style="color: #007bff; margin-bottom: 5px;">Refresh</h1>
        <p style="color: #666; margin-bottom: 25px;">Insira seu código de plantão</p>
        <input type="text" id="user" placeholder="Seu Usuário">
        <input type="password" id="code" placeholder="Código de 1 Hora">
        <button onclick="validar()">Confirmar Presença</button>
    </div>
    <script>
        async function validar() {
            const btn = document.querySelector('button');
            btn.disabled = true;
            const res = await fetch('/colaborador/validar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ usuario: document.getElementById('user').value, codigo: document.getElementById('code').value })
            });
            const data = await res.json();
            alert(data.msg);
            document.getElementById('code').value = '';
            btn.disabled = false;
        }
    </script>
</body>
</html>
