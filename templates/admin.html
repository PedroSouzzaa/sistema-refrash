<style>
    .status-check { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .status-ausencia { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
</style>

<script>
    async function carregar() {
        const res = await fetch('/admin/status_usuarios');
        const dados = await res.json();
        const tbody = document.querySelector('#tabela tbody');
        tbody.innerHTML = '';

        dados.forEach(u => {
            let sClass = u.ultimo_status === 'Verificado, registro completo' ? 'status-check' : 'status-ausencia';
            let dText = u.ultimo_registro ? new Date(u.ultimo_registro).toLocaleString('pt-BR') : 'Sem registro';

            tbody.innerHTML += `<tr>
                <td>${u.nome} ${u.sobrenome}</td>
                <td>${u.empresa} / ${u.sede}</td>
                <td>${u.portaria} (${u.turno})</td>
                <td>${dText}</td>
                <td><span class="badge ${sClass}">${u.ultimo_status || 'Pendente'}</span></td>
                <td><code>${u.codigo_atual}</code></td>
            </tr>`;
        });
    }
    // ... resto do script ...
</script>
