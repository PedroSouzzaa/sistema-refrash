<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #002855; --red: #E31E24; --bg: #f0f3f6; --success: #27ae60; --orange: #f39200; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        
        .sidebar { width: 260px; background: var(--blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .main { margin-left: 260px; padding: 30px; width: calc(100% - 260px); }
        
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Grid de Formulário */
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--blue); }
        .form-group input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        
        /* Botões de Ação Superior */
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .action-group { display: flex; gap: 8px; }

        .btn-action { border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; color: white; transition: 0.2s; font-size: 13px; }
        .btn-action:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .btn-pdf { background: #e74c3c; }
        .btn-excel { background: #27ae60; }
        .btn-whatsapp { background: #25d366; }
        .btn-save { background: var(--orange); padding: 12px 25px; }

        /* Tabelas */
        .monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8f9fb; padding: 12px; font-size: 11px; color: var(--blue); border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 12px; }
        
        .status-ok { color: var(--success); font-weight: bold; font-size: 10px; }
        .action-btn-small { border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; color: white; margin-right: 5px; }
        
        h3 { margin-top: 0; text-transform: uppercase; font-size: 15px; border-left: 4px solid var(--orange); padding-left: 10px; color: var(--blue); }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: var(--orange);">NBL LOG</h2>
        <p>Painel Administrativo</p>
        <hr style="opacity: 0.1; margin: 20px 0;">
        <button onclick="location.href='/'" style="width:100%; padding:12px; background:rgba(255,255,255,0.1); border:none; color:white; cursor:pointer; border-radius: 6px;">
            <i class="fas fa-desktop"></i> Ir para Totem
        </button>
    </div>

    <div class="main">
        <div class="card">
            <h3 id="formTitle">Cadastrar Novo Colaborador</h3>
            <div class="grid-form">
                <div class="form-group"><label>Nome</label><input type="text" id="cad_nome"></div>
                <div class="form-group"><label>Sobrenome</label><input type="text" id="cad_sobrenome"></div>
                <div class="form-group"><label>ID (Login)</label><input type="text" id="cad_usuario"></div>
                <div class="form-group"><label>Código Único</label><input type="password" id="cad_codigo"></div>
                <div class="form-group"><label>Empresa</label><input type="text" id="cad_empresa"></div>
                <div class="form-group"><label>Sede / Filial</label><input type="text" id="cad_sede"></div>
            </div>
            <button onclick="salvarUsuario()" class="btn-action btn-save" id="btnSalvar">
                <i class="fas fa-user-plus"></i> SALVAR COLABORADOR
            </button>
            <button onclick="limparFormulario()" id="btnCancelar" style="display:none; margin-top:10px; background:#95a5a6; border:none; color:white; padding:10px; border-radius:6px; cursor:pointer;">CANCELAR EDIÇÃO</button>
        </div>

        <div class="card">
            <div class="header-flex">
                <h3 style="border-color: var(--red);">Monitoramento de Batidas (Real)</h3>
                <div class="action-group">
                    <button onclick="exportar('pdf')" class="btn-action btn-pdf">
                        <i class="fas fa-file-pdf"></i> PDF
                    </button>
                    <button onclick="exportar('excel')" class="btn-action btn-excel">
                        <i class="fas fa-file-excel"></i> EXCEL
                    </button>
                    <button onclick="enviarWhatsapp()" class="btn-action btn-whatsapp">
                        <i class="fab fa-whatsapp"></i> WHATSAPP
                    </button>
                </div>
            </div>
            
            <div class="monitor-grid">
                <div>
                    <h4>PORTARIA P1</h4>
                    <table id="tableP1">
                        <thead><tr><th>Colaborador</th><th>Data/Hora</th></tr></thead>
                        <tbody id="bodyP1"></tbody>
                    </table>
                </div>
                <div>
                    <h4>PORTARIA P2</h4>
                    <table id="tableP2">
                        <thead><tr><th>Colaborador</th><th>Data/Hora</th></tr></thead>
                        <tbody id="bodyP2"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="border-color: #3498db;">Gestão de Colaboradores</h3>
            <table>
                <thead>
                    <tr><th>Nome Completo</th><th>ID / Login</th><th>Empresa</th><th>Ações</th></tr>
                </thead>
                <tbody id="listaUsuarios"></tbody>
            </table>
        </div>
    </div>

    <script>
        // Funções de API
        async function salvarUsuario() {
            const data = {
                nome: document.getElementById('cad_nome').value.trim(),
                sobrenome: document.getElementById('cad_sobrenome').value.trim(),
                usuario_login: document.getElementById('cad_usuario').value.trim().toLowerCase(),
                codigo_atual: document.getElementById('cad_codigo').value.trim(),
                empresa: document.getElementById('cad_empresa').value.trim(),
                sede: document.getElementById('cad_sede').value.trim()
            };
            if(!data.usuario_login || !data.codigo_atual) return alert("Preencha os campos obrigatórios.");
            
            const res = await fetch('/admin/usuarios/salvar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) { alert("Sucesso!"); limparFormulario(); listarUsuarios(); }
        }

        async function listarUsuarios() {
            const res = await fetch('/admin/usuarios/listar');
            const users = await res.json();
            document.getElementById('listaUsuarios').innerHTML = users.map(u => `
                <tr>
                    <td>${u.nome} ${u.sobrenome}</td>
                    <td><code>${u.usuario_login}</code></td>
                    <td>${u.empresa}</td>
                    <td>
                        <button class="action-btn-small" style="background:#3498db" onclick='prepararEdicao(${JSON.stringify(u)})'><i class="fas fa-edit"></i></button>
                        <button class="action-btn-small" style="background:#e74c3c" onclick="excluirUsuario('${u.usuario_login}')"><i class="fas fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        async function carregarMonitoramento() {
            const res = await fetch('/admin/status_realtime');
            const logs = await res.json();
            const b1 = document.getElementById('bodyP1'); const b2 = document.getElementById('bodyP2');
            b1.innerHTML = ''; b2.innerHTML = '';
            logs.forEach(l => {
                const tr = `<tr><td><b>${l.nome}</b><br><small>${l.empresa}</small></td><td><span class="status-ok">✅ OK</span><br><small>${l.hora}</small></td></tr>`;
                if(l.portaria === 'P1') b1.innerHTML += tr; else b2.innerHTML += tr;
            });
        }

        function prepararEdicao(user) {
            document.getElementById('cad_nome').value = user.nome;
            document.getElementById('cad_sobrenome').value = user.sobrenome;
            document.getElementById('cad_usuario').value = user.usuario_login;
            document.getElementById('cad_usuario').readOnly = true;
            document.getElementById('cad_codigo').value = user.codigo_atual;
            document.getElementById('cad_empresa').value = user.empresa;
            document.getElementById('cad_sede').value = user.sede;
            document.getElementById('formTitle').innerText = "Editar Colaborador";
            document.getElementById('btnCancelar').style.display = "block";
            window.scrollTo(0,0);
        }

        function limparFormulario() {
            document.querySelectorAll('.grid-form input').forEach(i => { i.value = ''; i.readOnly = false; });
            document.getElementById('formTitle').innerText = "Cadastrar Novo Colaborador";
            document.getElementById('btnCancelar').style.display = "none";
        }

        async function excluirUsuario(login) {
            if(confirm("Excluir usuário?")) {
                await fetch(`/admin/usuarios/excluir/${login}`, { method: 'DELETE' });
                listarUsuarios();
            }
        }

        function exportar(fmt) {
            const hoje = new Date().toISOString().split('T')[0];
            window.open(`/admin/exportar/${fmt}?inicio=${hoje}&fim=${hoje}&turno=Todos`, '_blank');
        }

        function enviarWhatsapp() {
            const fone = "55919XXXXXXXX"; // Configure aqui
            let msg = "*📊 RELATÓRIO NBL LOG*\n\n";
            document.querySelectorAll('#bodyP1 tr, #bodyP2 tr').forEach(r => {
                msg += `✅ ${r.querySelector('b').innerText} (${r.querySelectorAll('small')[1].innerText})\n`;
            });
            window.open(`https://api.whatsapp.com/send?phone=${fone}&text=${encodeURIComponent(msg)}`, '_blank');
        }

        listarUsuarios();
        carregarMonitoramento();
        setInterval(carregarMonitoramento, 30000);
    </script>
</body>
</html>
