<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #002855; --red: #E31E24; --bg: #f0f3f6; --success: #27ae60; --orange: #f39200; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 260px; background: var(--blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .main { margin-left: 260px; padding: 30px; width: calc(100% - 260px); }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--blue); }
        .form-group input { padding: 10px; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .header-flex { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .action-group { display: flex; gap: 8px; }
        .btn-action { border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; color: white; transition: 0.2s; font-size: 13px; }
        .btn-pdf { background: #e74c3c; } .btn-excel { background: #27ae60; } .btn-whatsapp { background: #25d366; } .btn-save { background: var(--orange); }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; background: #f8f9fb; padding: 12px; font-size: 11px; color: var(--blue); border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 12px; }
        .monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2 style="color: var(--orange);">NBL LOG</h2>
        <p>Painel Administrativo</p>
        <button onclick="location.href='/'" style="width:100%; padding:10px; cursor:pointer;">Ir para Totem</button>
    </div>

    <div class="main">
        <div class="card">
            <h3 id="formTitle">Cadastrar Novo Colaborador</h3>
            <div class="grid-form">
                <div class="form-group"><label>Nome</label><input type="text" id="nome"></div>
                <div class="form-group"><label>Sobrenome</label><input type="text" id="sobrenome"></div>
                <div class="form-group"><label>ID (Login)</label><input type="text" id="usuario_login"></div>
                <div class="form-group"><label>Código Único</label><input type="password" id="codigo_atual"></div>
                <div class="form-group"><label>Empresa</label><input type="text" id="empresa"></div>
                <div class="form-group"><label>Sede / Filial</label><input type="text" id="sede"></div>
            </div>
            <button onclick="salvarUsuario()" class="btn-action btn-save" id="btnSalvar">SALVAR COLABORADOR</button>
            <button onclick="limparFormulario()" id="btnCancelar" style="display:none; margin-top:10px;">CANCELAR</button>
        </div>

        <div class="card">
            <div class="header-flex">
                <h3>Monitoramento de Batidas</h3>
                <div class="action-group">
                    <button onclick="exportar('pdf')" class="btn-action btn-pdf">PDF</button>
                    <button onclick="exportar('excel')" class="btn-action btn-excel">EXCEL</button>
                    <button onclick="enviarWhatsapp()" class="btn-action btn-whatsapp">WHATSAPP</button>
                </div>
            </div>
            <div class="monitor-grid">
                <div><h4>PORTARIA P1</h4><table><thead><tr><th>Nome</th><th>Hora</th></tr></thead><tbody id="bodyP1"></tbody></table></div>
                <div><h4>PORTARIA P2</h4><table><thead><tr><th>Nome</th><th>Hora</th></tr></thead><tbody id="bodyP2"></tbody></table></div>
            </div>
        </div>

        <div class="card">
            <h3>Gestão de Colaboradores</h3>
            <table>
                <thead><tr><th>Nome</th><th>ID</th><th>Empresa</th><th>Ações</th></tr></thead>
                <tbody id="listaUsuarios"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function salvarUsuario() {
            const data = {
                nome: document.getElementById('nome').value,
                sobrenome: document.getElementById('sobrenome').value,
                usuario_login: document.getElementById('usuario_login').value.toLowerCase(),
                codigo_atual: document.getElementById('codigo_atual').value,
                empresa: document.getElementById('empresa').value,
                sede: document.getElementById('sede').value
            };
            
            try {
                const res = await fetch('/admin/usuarios/salvar', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(data)
                });
                if(res.ok) {
                    alert("Salvo com sucesso!");
                    limparFormulario();
                    listarUsuarios();
                } else {
                    alert("Erro ao salvar.");
                }
            } catch(e) { alert("Erro de conexão com o servidor."); }
        }

        async function listarUsuarios() {
            const res = await fetch('/admin/usuarios/listar');
            const users = await res.json();
            document.getElementById('listaUsuarios').innerHTML = users.map(u => `
                <tr>
                    <td>${u.nome} ${u.sobrenome}</td>
                    <td>${u.usuario_login}</td>
                    <td>${u.empresa}</td>
                    <td>
                        <button onclick='prepararEdicao(${JSON.stringify(u)})'>Editar</button>
                        <button onclick="excluirUsuario('${u.usuario_login}')">Excluir</button>
                    </td>
                </tr>
            `).join('');
        }

        function prepararEdicao(u) {
            document.getElementById('nome').value = u.nome;
            document.getElementById('sobrenome').value = u.sobrenome;
            document.getElementById('usuario_login').value = u.usuario_login;
            document.getElementById('usuario_login').readOnly = true;
            document.getElementById('codigo_atual').value = u.codigo_atual;
            document.getElementById('empresa').value = u.empresa;
            document.getElementById('sede').value = u.sede;
            document.getElementById('formTitle').innerText = "Editar Colaborador";
            document.getElementById('btnCancelar').style.display = "inline";
        }

        function limparFormulario() {
            document.querySelectorAll('input').forEach(i => { i.value = ''; i.readOnly = false; });
            document.getElementById('formTitle').innerText = "Cadastrar Novo Colaborador";
            document.getElementById('btnCancelar').style.display = "none";
        }

        async function excluirUsuario(login) {
            if(confirm("Deseja excluir?")) {
                await fetch(`/admin/usuarios/excluir/${login}`, { method: 'DELETE' });
                listarUsuarios();
            }
        }

        async function carregarMonitoramento() {
            const res = await fetch('/admin/status_realtime');
            const logs = await res.json();
            const b1 = document.getElementById('bodyP1'); const b2 = document.getElementById('bodyP2');
            b1.innerHTML = ''; b2.innerHTML = '';
            logs.forEach(l => {
                const tr = `<tr><td><b>${l.nome}</b><br><small>${l.empresa}</small></td><td>${l.hora}</td></tr>`;
                if(l.portaria === 'P1') b1.innerHTML += tr; else b2.innerHTML += tr;
            });
        }

        function exportar(fmt) {
            const hoje = new Date().toISOString().split('T')[0];
            window.open(`/admin/exportar/${fmt}?inicio=${hoje}&fim=${hoje}&turno=Todos`, '_blank');
        }

        listarUsuarios();
        carregarMonitoramento();
        setInterval(carregarMonitoramento, 30000);
    </script>
</body>
</html>
