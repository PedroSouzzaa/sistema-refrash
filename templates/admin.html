<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Refresh Admin - Gestão Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; --accent: #3498db; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 250px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .main { margin-left: 250px; padding: 30px; width: calc(100% - 250px); box-sizing: border-box; }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h3 { margin-top: 0; color: var(--primary); border-left: 4px solid var(--accent); padding-left: 10px; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 15px; }
        .form-group { display: flex; flex-direction: column; }
        label { font-size: 0.85rem; font-weight: bold; margin-bottom: 5px; color: #555; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; color: white; transition: 0.3s; }
        .btn-success { background: var(--success); }
        .btn-danger { background: var(--danger); padding: 5px 10px; }
        .monitor-split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 10px; }
        th { text-align: left; padding: 12px; background: #f8f9fa; border-bottom: 2px solid #eee; }
        td { padding: 12px; border-bottom: 1px solid #eee; }
        .user-name { font-weight: bold; color: var(--primary); display: block; }
        .user-meta { font-size: 11px; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>Refresh Admin</h2>
        <button onclick="location.href='/'" class="btn" style="background:#34495e; width:100%"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>

    <div class="main">
        <div class="card">
            <h3><i class="fas fa-user-plus"></i> Novo Colaborador</h3>
            <div class="grid-form">
                <div class="form-group"><label>Nome</label><input type="text" id="nome"></div>
                <div class="form-group"><label>Sobrenome</label><input type="text" id="sobrenome"></div>
                <div class="form-group"><label>Usuário (Login)</label><input type="text" id="usuario_login"></div>
                <div class="form-group"><label>Código</label><input type="text" id="codigo_atual"></div>
                <div class="form-group"><label>Empresa</label><input type="text" id="empresa"></div>
                <div class="form-group"><label>Filial/Sede</label><input type="text" id="sede"></div>
            </div>
            <button onclick="salvarUsuario()" class="btn btn-success"><i class="fas fa-save"></i> Salvar</button>
        </div>

        <div class="card">
            <h3><i class="fas fa-users"></i> Colaboradores Cadastrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>Empresa/Sede</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaUsuarios"></tbody>
            </table>
        </div>

        <div class="monitor-split">
            <div class="card">
                <h3>🔵 Portaria 1 (P1)</h3>
                <table>
                    <thead><tr><th>Colaborador</th><th>Turno</th><th>Hora</th></tr></thead>
                    <tbody id="bodyP1"></tbody>
                </table>
            </div>
            <div class="card">
                <h3>🟡 Portaria 2 (P2)</h3>
                <table>
                    <thead><tr><th>Colaborador</th><th>Turno</th><th>Hora</th></tr></thead>
                    <tbody id="bodyP2"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        async function salvarUsuario() {
            const data = {
                nome: document.getElementById('nome').value,
                sobrenome: document.getElementById('sobrenome').value,
                usuario_login: document.getElementById('usuario_login').value.toLowerCase(),
                codigo_atual: document.getElementById('codigo_atual').value,
                empresa: document.getElementById('empresa').value,
                sede: document.getElementById('sede').value
            };
            const res = await fetch('/admin/usuarios/salvar', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            if(res.ok) { alert("Sucesso!"); listarUsuarios(); carregarMonitoramento(); }
        }

        async function listarUsuarios() {
            const res = await fetch('/admin/usuarios/listar');
            const dados = await res.json();
            const lista = document.getElementById('listaUsuarios');
            lista.innerHTML = '';
            dados.forEach(u => {
                lista.innerHTML += `
                    <tr>
                        <td>${u.nome} ${u.sobrenome}</td>
                        <td>${u.usuario_login}</td>
                        <td>${u.empresa} - ${u.sede}</td>
                        <td><button class="btn btn-danger" onclick="excluirUsuario('${u.usuario_login}')"><i class="fas fa-trash"></i></button></td>
                    </tr>`;
            });
        }

        async function excluirUsuario(login) {
            if(confirm(`Excluir o usuário ${login}?`)) {
                await fetch(`/admin/usuarios/excluir/${login}`, { method: 'DELETE' });
                listarUsuarios();
            }
        }

        async function carregarMonitoramento() {
            const res = await fetch('/admin/status_realtime');
            const logs = await res.json();
            const b1 = document.getElementById('bodyP1'); const b2 = document.getElementById('bodyP2');
            b1.innerHTML = ''; b2.innerHTML = '';
            logs.forEach(l => {
                const row = `<tr><td><span class="user-name">${l.nome}</span><span class="user-meta">${l.empresa} - ${l.sede}</span></td><td>${l.turno_registro}</td><td>${l.hora}</td></tr>`;
                if(l.portaria === 'P1') b1.innerHTML += row; else b2.innerHTML += row;
            });
        }

        listarUsuarios();
        carregarMonitoramento();
        setInterval(carregarMonitoramento, 10000);
    </script>
</body>
</html>
