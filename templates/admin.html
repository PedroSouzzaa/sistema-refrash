<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | NBL LOG</title>
    <link rel="shortcut icon" href="/static/NBL_LOG_icone.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --nbl-blue: #002855; --nbl-orange: #f39200; --bg: #f0f3f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { 
            width: 260px; background: var(--nbl-blue); color: white; height: 100vh; 
            position: fixed; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column;
        }
        .sidebar-logo { text-align: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .sidebar-logo img { width: 120px; border-radius: 8px; }
        .main { margin-left: 260px; padding: 30px; width: calc(100% - 260px); box-sizing: border-box; }
        .card { background: white; border-radius: 12px; padding: 25px; margin-bottom: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h3 { margin-top: 0; color: var(--nbl-blue); border-left: 5px solid var(--nbl-orange); padding-left: 15px; text-transform: uppercase; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-top: 15px; }
        input, select { padding: 12px; border: 1px solid #dce4ec; border-radius: 6px; }
        .btn { padding: 12px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; display: inline-flex; align-items: center; gap: 8px; }
        .btn-orange { background: var(--nbl-orange); color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 15px; background: #f8f9fb; color: var(--nbl-blue); border-bottom: 2px solid #edf2f7; }
        td { padding: 15px; border-bottom: 1px solid #edf2f7; font-size: 14px; }
        .monitor-split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo">
            <img src="/static/NBL_LOG_icone.jpg" alt="NBL LOG">
        </div>
        <button onclick="location.href='/'" class="btn" style="background: rgba(255,255,255,0.1); color: white; width: 100%; justify-content: center;">
            <i class="fas fa-desktop"></i> Ir para Totem
        </button>
    </div>
    <div class="main">
        <div class="card">
            <h3>Gestão de Colaboradores</h3>
            <div class="grid-form">
                <input type="text" id="nome" placeholder="Nome">
                <input type="text" id="sobrenome" placeholder="Sobrenome">
                <input type="text" id="usuario_login" placeholder="Login">
                <input type="text" id="codigo_atual" placeholder="Código">
                <input type="text" id="empresa" placeholder="Empresa">
                <input type="text" id="sede" placeholder="Filial">
            </div>
            <button onclick="salvarUsuario()" class="btn btn-orange" style="margin-top: 20px;"><i class="fas fa-plus"></i> CADASTRAR</button>
        </div>
        <div class="card">
            <h3>Monitoramento em Tempo Real</h3>
            <div class="monitor-split">
                <div><h4>Portaria 1</h4><table><tbody id="bodyP1"></tbody></table></div>
                <div><h4>Portaria 2</h4><table><tbody id="bodyP2"></tbody></table></div>
            </div>
        </div>
    </div>
    <script>
        async function salvarUsuario() {
            const data = {
                nome: document.getElementById('nome').value,
                sobrenome: document.getElementById('sobrenome').value,
                usuario_login: document.getElementById('usuario_login').value.toLowerCase(),
                codigo_atual: document.getElementById('codigo_atual').value,
                empresa: document.getElementById('empresa').value,
                sede: document.getElementById('sede').value
            };
            await fetch('/admin/usuarios/salvar', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            alert("Salvo!"); location.reload();
        }
        async function carregarMonitoramento() {
            const res = await fetch('/admin/status_realtime');
            const logs = await res.json();
            const b1 = document.getElementById('bodyP1'); const b2 = document.getElementById('bodyP2');
            b1.innerHTML = ''; b2.innerHTML = '';
            logs.forEach(l => {
                const row = `<tr><td><b>${l.nome}</b><br><small>${l.empresa}</small></td><td>${l.hora}</td></tr>`;
                if(l.portaria === 'P1') b1.innerHTML += row; else b2.innerHTML += row;
            });
        }
        setInterval(carregarMonitoramento, 5000); carregarMonitoramento();
    </script>
</body>
</html>
