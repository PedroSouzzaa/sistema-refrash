<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #002855; --red: #E31E24; --bg: #f0f3f6; --success: #27ae60; --orange: #f39200; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 260px; background: var(--blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .main { margin-left: 260px; padding: 30px; width: calc(100% - 260px); }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .form-group { display: flex; flex-direction: column; }
        .form-group label { font-size: 12px; font-weight: bold; margin-bottom: 5px; color: var(--blue); }
        .form-group input, .form-group select { padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
        .btn-action { border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; margin-right: 10px; }
        .btn-save { background: var(--orange); }
        .btn-pdf { background: var(--red); }
        .btn-excel { background: var(--success); }
        .btn-whatsapp { background: #25d366; }
        .monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th { text-align: left; background: #f8f9fb; padding: 10px; border-bottom: 2px solid #eee; }
        td { padding: 10px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>NBL LOG</h2>
        <p>Painel Administrativo</p>
        <hr>
        <button onclick="location.href='/'" style="width:100%; padding:10px; cursor:pointer;">Ir para Totem</button>
    </div>

    <div class="main">
        <div class="card">
            <h3>Relatórios e Filtros</h3>
            <div class="grid-form">
                <div class="form-group">
                    <label>Início</label>
                    <input type="date" id="rel_inicio">
                </div>
                <div class="form-group">
                    <label>Fim</label>
                    <input type="date" id="rel_fim">
                </div>
                <div class="form-group">
                    <label>Turno</label>
                    <select id="rel_turno">
                        <option value="Todos">Todos</option>
                        <option value="ADM">ADM</option>
                        <option value="Turno A">Turno A</option>
                        <option value="Turno B">Turno B</option>
                        <option value="Turno C">Turno C</option>
                    </select>
                </div>
            </div>
            <button onclick="exportar('pdf')" class="btn-action btn-pdf"><i class="fas fa-file-pdf"></i> PDF</button>
            <button onclick="exportar('excel')" class="btn-action btn-excel"><i class="fas fa-file-excel"></i> EXCEL</button>
        </div>

        <div class="card">
            <h3 id="formTitle">Novo Colaborador</h3>
            <div class="grid-form">
                <div class="form-group"><label>Nome</label><input type="text" id="nome"></div>
                <div class="form-group"><label>Sobrenome</label><input type="text" id="sobrenome"></div>
                <div class="form-group"><label>ID Login</label><input type="text" id="usuario_login"></div>
                <div class="form-group"><label>Código</label><input type="password" id="codigo_atual"></div>
                <div class="form-group"><label>Empresa</label><input type="text" id="empresa"></div>
                <div class="form-group"><label>Sede</label><input type="text" id="sede"></div>
            </div>
            <button onclick="salvarUsuario()" class="btn-action btn-save">SALVAR USUÁRIO</button>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h3>Monitoramento em Tempo Real</h3>
                <button onclick="enviarWhatsapp()" class="btn-action btn-whatsapp"><i class="fab fa-whatsapp"></i> WHATSAPP</button>
            </div>
            <div class="monitor-grid">
                <div><h4>PORTARIA P1</h4><table><thead><tr><th>Nome</th><th>Hora</th></tr></thead><tbody id="bodyP1"></tbody></table></div>
                <div><h4>PORTARIA P2</h4><table><thead><tr><th>Nome</th><th>Hora</th></tr></thead><tbody id="bodyP2"></tbody></table></div>
            </div>
        </div>
    </div>

    <script>
        // Função para exportar Relatórios
        function exportar(formato) {
            const inicio = document.getElementById('rel_inicio').value;
            const fim = document.getElementById('rel_fim').value;
            const turno = document.getElementById('rel_turno').value;

            if(!inicio || !fim) {
                alert("Por favor, selecione as datas de início e fim.");
                return;
            }

            const url = `/admin/exportar/${formato}?inicio=${inicio}&fim=${fim}&turno=${turno}`;
            window.open(url, '_blank');
        }

        async function salvarUsuario() {
            const data = {
                nome: document.getElementById('nome').value,
                sobrenome: document.getElementById('sobrenome').value,
                usuario_login: document.getElementById('usuario_login').value.toLowerCase(),
                codigo_atual: document.getElementById('codigo_atual').value,
                empresa: document.getElementById('empresa').value,
                sede: document.getElementById('sede').value
            };
            const res = await fetch('/admin/usuarios/salvar', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });
            if(res.ok) { alert("Usuário salvo com sucesso!"); location.reload(); }
        }

        function enviarWhatsapp() {
            const numero = "55919XXXXXXXX"; // Coloque o número aqui
            let msg = "*📋 RELATÓRIO DE BATIDAS - NBL LOG*\n\n";
            
            msg += "*PORTARIA P1*\n";
            document.querySelectorAll('#bodyP1 tr').forEach(r => {
                msg += `✅ ${r.cells[0].innerText.split('\n')[0]} (${r.cells[1].innerText})\n`;
            });
            
            msg += "\n*PORTARIA P2*\n";
            document.querySelectorAll('#bodyP2 tr').forEach(r => {
                msg += `✅ ${r.cells[0].innerText.split('\n')[0]} (${r.cells[1].innerText})\n`;
            });

            window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${encodeURIComponent(msg)}`, '_blank');
        }

        async function carregarMonitoramento() {
            const res = await fetch('/admin/status_realtime');
            const logs = await res.json();
            const b1 = document.getElementById('bodyP1'); const b2 = document.getElementById('bodyP2');
            b1.innerHTML = ''; b2.innerHTML = '';
            logs.forEach(l => {
                const tr = `<tr><td><b>${l.nome}</b><br><small>${l.empresa}</small></td><td>${l.hora}</td></tr>`;
                if(l.portaria === 'P1') b1.innerHTML += tr; else b2.innerHTML += tr;
            });
        }

        carregarMonitoramento();
        setInterval(carregarMonitoramento, 30000);
    </script>
</body>
</html>
