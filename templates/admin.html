<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Refresh Admin - Gestão Central</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #2c3e50; --success: #27ae60; --danger: #e74c3c; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 250px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 20px; }
        .main { margin-left: 250px; padding: 30px; width: calc(100% - 250px); }
        .card { background: white; border-radius: 8px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; }
        input, select { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        button { padding: 12px; border: none; border-radius: 4px; cursor: pointer; color: white; font-weight: bold; }
        .monitor-split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #eee; }
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 10px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Refresh Admin</h2>
        <nav><button onclick="location.href='/'" style="background:#34495e; width:100%"><i class="fas fa-sign-out-alt"></i> Sair</button></nav>
    </div>

    <div class="main">
        <div class="card">
            <h3><i class="fas fa-user-plus"></i> Cadastro de Colaborador</h3>
            <div class="grid-form">
                <div style="display:flex; flex-direction:column;"><label>Nome</label><input type="text" id="nome"></div>
                <div style="display:flex; flex-direction:column;"><label>Sobrenome</label><input type="text" id="sobrenome"></div>
                <div style="display:flex; flex-direction:column;"><label>ID Usuário</label><input type="text" id="usuario_login"></div>
                <div style="display:flex; flex-direction:column;"><label>Código Único</label><input type="text" id="codigo_atual"></div>
                <div style="display:flex; flex-direction:column;"><label>Empresa</label><input type="text" id="empresa"></div>
                <div style="display:flex; flex-direction:column;"><label>Sede/Filial</label><input type="text" id="sede"></div>
            </div>
            <button onclick="salvar()" style="background:var(--success); margin-top:20px; width:200px;">Salvar Usuário</button>
        </div>

        <div class="monitor-split">
            <div class="card">
                <h3><span style="color:#3498db">●</span> Portaria 1 (P1)</h3>
                <table><thead><tr><th>Colaborador</th><th>Turno</th><th>Hora</th></tr></thead><tbody id="bodyP1"></tbody></table>
            </div>
            <div class="card">
                <h3><span style="color:#f1c40f">●</span> Portaria 2 (P2)</h3>
                <table><thead><tr><th>Colaborador</th><th>Turno</th><th>Hora</th></tr></thead><tbody id="bodyP2"></tbody></table>
            </div>
        </div>

        <div class="card">
            <h3><i class="fas fa-download"></i> Extração de Relatórios</h3>
            <div class="grid-form">
                <input type="datetime-local" id="rel_inicio">
                <input type="datetime-local" id="rel_fim">
                <select id="rel_turno"><option value="Todos">Todos Turnos</option><option value="Manhã">Manhã</option><option value="Tarde">Tarde</option><option value="Noite">Noite</option></select>
                <div style="display:flex; gap:10px;"><button onclick="exportar('excel')" style="background:#27ae60; flex:1">Excel</button><button onclick="exportar('pdf')" style="background:#c0392b; flex:1">PDF</button></div>
            </div>
        </div>
    </div>

    <script>
        async function salvar() {
            const data = {
                nome: document.getElementById('nome').value, sobrenome: document.getElementById('sobrenome').value,
                usuario_login: document.getElementById('usuario_login').value.toLowerCase(), codigo_atual: document.getElementById('codigo_atual').value,
                empresa: document.getElementById('empresa').value, sede: document.getElementById('sede').value
            };
            const res = await fetch('/admin/usuarios/salvar', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            if(res.ok) { alert("Usuário cadastrado!"); carregar(); }
        }

        async function carregar() {
            const res = await fetch('/admin/status_realtime');
            const logs = await res.json();
            const b1 = document.getElementById('bodyP1'); const b2 = document.getElementById('bodyP2');
            b1.innerHTML = ''; b2.innerHTML = '';

            logs.forEach(l => {
                const row = `<tr><td><b>${l.nome}</b><br><small>${l.empresa}</small></td><td>${l.turno_registro}</td><td>${l.hora}</td></tr>`;
                if(l.portaria === 'P1') b1.innerHTML += row; else b2.innerHTML += row;
            });
        }

        function exportar(fmt) {
            const qs = `?inicio=${document.getElementById('rel_inicio').value}&fim=${document.getElementById('rel_fim').value}&turno=${document.getElementById('rel_turno').value}`;
            window.open(`/admin/exportar/${fmt}${qs}`, '_blank');
        }

        setInterval(carregar, 5000); carregar();
    </script>
</body>
</html>
