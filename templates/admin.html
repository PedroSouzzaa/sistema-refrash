<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #002855; --red: #E31E24; --bg: #f0f3f6; --success: #27ae60; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 260px; background: var(--blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .main { margin-left: 260px; padding: 30px; width: calc(100% - 260px); }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .monitor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8f9fb; padding: 12px; font-size: 11px; color: var(--blue); }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 12px; }
        .status-ok { color: var(--success); font-weight: bold; font-size: 10px; }
        .btn-whatsapp { background: #25d366; color: white; border: none; padding: 10px 15px; border-radius: 6px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>NBL LOG</h2>
        <p>Painel de Controle</p>
        <hr style="opacity: 0.1;">
        <button onclick="location.href='/'" style="width:100%; padding:10px; background:rgba(255,255,255,0.1); border:none; color:white; cursor:pointer;">Ir para Totem</button>
    </div>

    <div class="main">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h3 style="color: var(--red);">MONITORAMENTO EM TEMPO REAL (BATIDAS DO INDEX)</h3>
                <button onclick="enviarWhatsapp()" class="btn-whatsapp">
                    <i class="fab fa-whatsapp"></i> RELATÓRIO DO TURNO
                </button>
            </div>
            
            <div class="monitor-grid">
                <div>
                    <h4>PORTARIA P1</h4>
                    <table id="tableP1">
                        <thead><tr><th>Colaborador / Empresa</th><th>Data/Hora</th></tr></thead>
                        <tbody id="bodyP1"></tbody>
                    </table>
                </div>
                <div>
                    <h4>PORTARIA P2</h4>
                    <table id="tableP2">
                        <thead><tr><th>Colaborador / Empresa</th><th>Data/Hora</th></tr></thead>
                        <tbody id="bodyP2"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <div class="card">
            <h3 style="color: var(--blue);">EXPORTAR RELATÓRIOS OFICIAIS</h3>
            <div style="display: flex; gap: 10px;">
                <input type="date" id="rel_inicio">
                <input type="date" id="rel_fim">
                <select id="rel_turno">
                    <option value="Todos">Todos os Turnos</option>
                    <option value="Manhã">Manhã</option>
                    <option value="Tarde">Tarde</option>
                    <option value="Noite">Noite</option>
                </select>
                <button onclick="exportar('pdf')">Gerar PDF</button>
                <button onclick="exportar('excel')">Gerar Excel</button>
            </div>
        </div>
    </div>

    <script>
        async function carregarMonitoramento() {
            try {
                const res = await fetch('/admin/status_realtime');
                const logs = await res.json();
                const b1 = document.getElementById('bodyP1');
                const b2 = document.getElementById('bodyP2');
                b1.innerHTML = ''; b2.innerHTML = '';

                logs.forEach(l => {
                    const tr = `
                        <tr>
                            <td>
                                <b>${l.nome} ${l.sobrenome}</b><br>
                                <small>${l.empresa} (${l.sede})</small>
                            </td>
                            <td>
                                <span class="status-ok">✅ VERIFICADO</span><br>
                                <small>${l.data} ${l.hora}</small><br>
                                <small style="color:var(--red)">Turno: ${l.turno_registro}</small>
                            </td>
                        </tr>
                    `;
                    if(l.portaria === 'P1') b1.innerHTML += tr;
                    else b2.innerHTML += tr;
                });
            } catch (e) { console.error("Erro:", e); }
        }

        function enviarWhatsapp() {
            const numero = "55919XXXXXXXX"; // Configure seu número aqui
            let msg = "*📋 RELATÓRIO DE BATIDAS - NBL LOG*\n";
            msg += "*Gerado em:* " + new Date().toLocaleString() + "\n\n";

            msg += "*PORTARIA P1*\n";
            document.querySelectorAll('#bodyP1 tr').forEach(row => {
                const nome = row.querySelector('b').innerText;
                const info = row.querySelectorAll('small')[1].innerText;
                msg += `✅ ${nome} - ${info}\n`;
            });

            msg += "\n*PORTARIA P2*\n";
            document.querySelectorAll('#bodyP2 tr').forEach(row => {
                const nome = row.querySelector('b').innerText;
                const info = row.querySelectorAll('small')[1].innerText;
                msg += `✅ ${nome} - ${info}\n`;
            });

            window.open(`https://api.whatsapp.com/send?phone=${numero}&text=${encodeURIComponent(msg)}`, '_blank');
        }

        function exportar(fmt) {
            const ini = document.getElementById('rel_inicio').value;
            const fim = document.getElementById('rel_fim').value;
            const t = document.getElementById('rel_turno').value;
            if(!ini || !fim) return alert("Defina o período.");
            window.open(`/admin/exportar/${fmt}?inicio=${ini}&fim=${fim}&turno=${t}`, '_blank');
        }

        // Atualiza a cada 1 hora (3600000ms)
        carregarMonitoramento();
        setInterval(carregarMonitoramento, 3600000);
    </script>
</body>
</html>
