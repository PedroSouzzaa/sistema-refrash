<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 30px;
            background: #2c3e50;
            color: white;
        }

        .panel {
            max-width: 800px;
            margin: auto;
            background: #34495e;
            padding: 25px;
            border-radius: 8px;
        }

        input {
            padding: 10px;
            margin: 5px;
            border-radius: 4px;
            border: none;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            color: #333;
        }

        th,
        td {
            padding: 10px;
            border: 1px solid #ddd;
            text-align: left;
        }

        .btn {
            padding: 10px 20px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            font-weight: bold;
        }

        .btn-green {
            background: #27ae60;
            color: white;
        }
    </style>
</head>

<body>
    <div class="panel">
        <h1>Painel de Controle</h1>
        <input type="password" id="adm_pass" placeholder="Senha Mestra Admin">

        <div class="grid">
            <div style="border-right: 1px solid #555; padding-right: 20px;">
                <h3>Atribuir Novo Código</h3>
                <input type="text" id="new_user" placeholder="Colaborador">
                <input type="text" id="new_code" placeholder="Código">
                <button class="btn btn-green" onclick="gerar()">Atualizar Código</button>
            </div>
            <div>
                <h3>Relatórios</h3>
                <button class="btn" onclick="verLogs()">Atualizar Histórico</button>
            </div>
        </div>

        <div id="logs_area"></div>
    </div>

    <script>
        async function gerar() {
            const res = await fetch('/admin/gerar', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    admin_pass: document.getElementById('adm_pass').value,
                    usuario: document.getElementById('new_user').value,
                    codigo: document.getElementById('new_code').value
                })
            });
            const data = await res.json();
            alert(data.msg);
        }

        async function verLogs() {
            const res = await fetch('/admin/logs', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ admin_pass: document.getElementById('adm_pass').value })
            });
            const logs = await res.json();
            if (logs.length === 0) return alert("Acesso negado ou sem dados");

            let table = '<table><tr><th>Colaborador</th><th>Data/Hora</th></tr>';
            logs.forEach(l => {
                table += `<tr><td>${l.colaborador}</td><td>${l.data_hora}</td></tr>`;
            });
            document.getElementById('logs_area').innerHTML = table + '</table>';
        }
    </script>
</body>

</html>
