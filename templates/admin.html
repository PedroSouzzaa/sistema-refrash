<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin | NBL LOG</title>
    <link rel="shortcut icon" href="static/NBL_LOG_icone.jpg" type="image/jpeg">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --nbl-blue: #002855; --nbl-orange: #f39200; --bg: #f0f3f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 260px; background: var(--nbl-blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .sidebar-logo img { width: 100px; border-radius: 8px; margin-bottom: 20px; }
        .main { margin-left: 260px; padding: 30px; width: calc(100% - 260px); }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        h3 { color: var(--nbl-blue); border-left: 4px solid var(--nbl-orange); padding-left: 10px; margin-top: 0; }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
        input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { text-align: left; background: #f8f9fb; padding: 12px; font-size: 13px; color: var(--nbl-blue); }
        td { padding: 12px; border-bottom: 1px solid #eee; font-size: 14px; }
        .btn-danger { background: #e74c3c; color: white; border: none; padding: 8px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-logo"><img src="static/NBL_LOG_icone.jpg" alt="Logo"></div>
        <button onclick="location.href='/'" style="width:100%; background:rgba(255,255,255,0.1); color:white; border:none; padding:10px; cursor:pointer;">Ir para Totem</button>
    </div>
    <div class="main">
        <div class="card">
            <h3>Novo Cadastro</h3>
            <div class="grid-form">
                <input type="text" id="nome" placeholder="Nome">
                <input type="text" id="sobrenome" placeholder="Sobrenome">
                <input type="text" id="usuario_login" placeholder="Login">
                <input type="text" id="codigo_atual" placeholder="Código">
                <input type="text" id="empresa" placeholder="Empresa">
                <input type="text" id="sede" placeholder="Filial">
            </div>
            <button onclick="salvarUsuario()" style="margin-top:15px; background:var(--nbl-orange); color:white; border:none; padding:10px 20px; border-radius:4px; cursor:pointer;">CADASTRAR</button>
        </div>

        <div class="card">
            <h3>Colaboradores Cadastrados</h3>
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>Empresa</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="listaUsuarios"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function listarUsuarios() {
            const res = await fetch('/admin/usuarios/listar');
            const dados = await res.json();
            const lista = document.getElementById('listaUsuarios');
            lista.innerHTML = dados.map(u => `
                <tr>
                    <td>${u.nome} ${u.sobrenome}</td>
                    <td>${u.usuario_login}</td>
                    <td>${u.empresa}</td>
                    <td>
                        <button class="btn-danger" onclick="excluirUsuario('${u.usuario_login}')">
                            <i class="fas fa-trash"></i>
                        </button>
                    </td>
                </tr>
            `).join('');
        }

        async function excluirUsuario(login) {
            if(confirm(`Deseja excluir ${login}?`)) {
                await fetch(`/admin/usuarios/excluir/${login}`, { method: 'DELETE' });
                listarUsuarios();
            }
        }

        async function salvarUsuario() {
            const data = {
                nome: document.getElementById('nome').value,
                sobrenome: document.getElementById('sobrenome').value,
                usuario_login: document.getElementById('usuario_login').value.toLowerCase(),
                codigo_atual: document.getElementById('codigo_atual').value,
                empresa: document.getElementById('empresa').value,
                sede: document.getElementById('sede').value
            };
            await fetch('/admin/usuarios/salvar', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(data) });
            listarUsuarios();
        }

        listarUsuarios();
    </script>
</body>
</html>
