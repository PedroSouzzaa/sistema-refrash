<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | NBL LOG</title>
    <style>
        body { font-family: sans-serif; background: #1C355E; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 40px; border-radius: 10px; text-align: center; width: 300px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #E31E24; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Acesso Admin</h2>
        <input type="text" id="u" placeholder="Usuário">
        <input type="password" id="p" placeholder="Senha">
        <button onclick="logar()">ENTRAR</button>
    </div>
    <script>
        async function logar() {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user: document.getElementById('u').value, password: document.getElementById('p').value })
            });
            if (res.ok) location.href = '/admin';
            else alert("Dados inválidos");
        }
    </script>
</body>
</html>
