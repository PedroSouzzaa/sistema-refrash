<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento Real-Time | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #002855; --green: #27ae60; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 250px; background: var(--blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .main { margin-left: 250px; padding: 30px; width: calc(100% - 250px); }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-ws { background: #25D366; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-bottom: 20px; }
        .btn-ws:hover { background: #128C7E; }
        .btn-nav { background: rgba(255,255,255,0.1); color: white; border: none; width: 100%; padding: 10px; text-align: left; margin-bottom: 5px; border-radius: 5px; cursor: pointer; }
        .btn-nav:hover { background: rgba(255,255,255,0.2); }
        table { width: 100%; border-collapse: collapse; background: white; }
        th { background: #f8f9fa; padding: 15px; text-align: left; color: var(--blue); border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #eee; }
        .badge { padding: 5px 10px; border-radius: 15px; font-size: 12px; font-weight: bold; background: #e1e8ed; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h3>NBL MONITOR</h3>
        <hr>
        <button class="btn-nav" onclick="location.href='/admin'"><i class="fas fa-users"></i> Gestão de Usuários</button>
        <button class="btn-nav" onclick="location.href='/admin/monitoramento'"><i class="fas fa-desktop"></i> Monitoramento</button>
        <button class="btn-nav" onclick="location.href='/'" style="margin-top: 20px;"><i class="fas fa-sign-out-alt"></i> Sair</button>
    </div>

    <div class="main">
        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <h2>Acessos em Tempo Real (Hoje)</h2>
                <button class="btn-ws" onclick="enviarRelatorioWhatsapp()">
                    <i class="fab fa-whatsapp"></i> ENVIAR RELATÓRIO NO GRUPO
                </button>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>Hora</th>
                        <th>Colaborador</th>
                        <th>Empresa</th>
                        <th>Portaria</th>
                        <th>Turno</th>
                    </tr>
                </thead>
                <tbody id="tabelaLogs">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        let logsAtuais = [];

        async function carregarLogs() {
            try {
                const res = await fetch('/api/admin/status_realtime');
                const data = await res.json();
                logsAtuais = data; // Guarda para o relatório
                const tbody = document.getElementById('tabelaLogs');
                tbody.innerHTML = '';

                data.forEach(l => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${l.hora}</strong></td>
                            <td>${l.nome} ${l.sobrenome}</td>
                            <td>${l.empresa}</td>
                            <td><span class="badge">${l.portaria}</span></td>
                            <td><span class="badge" style="background:#fff3cd">${l.turno}</span></td>
                        </tr>
                    `;
                });
            } catch (e) { console.error("Erro ao carregar logs"); }
        }

        function enviarRelatorioWhatsapp() {
            if (logsAtuais.length === 0) return alert("Nenhum registro hoje.");

            let texto = "*📊 RELATÓRIO DE ACESSOS - NBL LOG*\n";
            texto += "*Data:* " + new Date().toLocaleDateString('pt-BR') + "\n\n";

            logsAtuais.forEach(l => {
                texto += `🕒 ${l.hora} - *${l.nome}* (${l.portaria} - ${l.turno})\n`;
            });

            texto += "\n_Gerado automaticamente pelo sistema NBL_";
            
            // Abre o WhatsApp (pode ser o link do grupo ou geral para escolher o grupo)
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        // Atualiza a cada 5 segundos
        setInterval(carregarLogs, 5000);
        carregarLogs();
    </script>
</body>
</html>
