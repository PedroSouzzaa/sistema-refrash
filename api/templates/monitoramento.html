<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento Real-Time | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { 
            --blue: #002855; 
            --green: #27ae60; 
            --bg: #f4f7f9; 
            --excel: #107c41;
            --pdf: #a82424;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 250px; background: var(--blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .main { margin-left: 250px; padding: 30px; width: calc(100% - 250px); }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        
        /* Área de Botões de Ação */
        .actions-container { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
        
        .btn-action { color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 15px; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; transition: background 0.2s; }
        .btn-ws { background: #25D366; }
        .btn-ws:hover { background: #1ebd59; }
        .btn-excel { background: var(--excel); }
        .btn-excel:hover { background: #0b592e; }
        .btn-pdf { background: var(--pdf); }
        .btn-pdf:hover { background: #7d1a1a; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e1e8ed; }
        th { background: var(--blue); color: white; }
        .badge { background: #e1f5fe; color: #0288d1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        
        /* Estilos da Sidebar */
        .sidebar h3 { margin-top: 0; margin-bottom: 30px; text-align: center; letter-spacing: 1px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); }
        .sidebar a:hover { background: rgba(255,255,255,0.15); }
        .sidebar a.active { background: #4a7ab5; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>NBL LOG</h3>
        <a href="/admin">Gestão de Usuários</a>
        <a href="/admin/monitoramento" class="active">Monitoramento</a>
        <a href="/">Sair (Totem)</a>
    </div>

    <div class="main">
        <div class="actions-container">
            <button class="btn-action btn-ws" onclick="enviarRelatorioWhatsapp()">
                <i class="fab fa-whatsapp"></i> Enviar no WhatsApp
            </button>
            <a href="/admin/exportar/excel" class="btn-action btn-excel">
                <i class="fas fa-file-excel"></i> Exportar Excel
            </a>
            <a href="/admin/exportar/pdf" class="btn-action btn-pdf">
                <i class="fas fa-file-pdf"></i> Exportar PDF
            </a>
        </div>

        <div class="card">
            <h2>Acessos em Tempo Real (Hoje)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Horário</th>
                        <th>Colaborador</th>
                        <th>Empresa</th>
                        <th>Portaria</th>
                        <th>Turno</th>
                    </tr>
                </thead>
                <tbody id="logs-body">
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let logsAtuais = [];

        // Definição exata da sua tabela de horários obrigatórios por turno (conforme image_dd3508.png)
        const HORARIOS_OBRIGATORIOS = {
            "MANHÃ": ["07:00", "08:00", "09:00", "10:00", "11:00", "12:00", "13:00", "14:00"],
            "TARDE": ["15:00", "16:00", "17:00", "18:00", "19:00"],
            "NOITE": ["20:00", "21:00", "22:00", "23:00", "00:00", "01:00", "02:00", "03:00", "04:00", "05:00", "06:00"]
        };

        async function carregarLogs() {
            try {
                const res = await fetch('/api/admin/status_realtime');
                const data = await res.json();
                logsAtuais = data;

                const tbody = document.getElementById('logs-body');
                tbody.innerHTML = '';

                data.forEach(l => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${l.hora}</strong></td>
                            <td>${l.nome} ${l.sobrenome}</td>
                            <td>${l.empresa}</td>
                            <td><span class="badge">${l.portaria}</span></td>
                            <td><span class="badge" style="background:#fff3cd; color:#856404;">${l.turno}</span></td>
                        </tr>
                    `;
                });
            } catch (e) { 
                console.error("Erro ao carregar logs", e); 
            }
        }

        function enviarRelatorioWhatsapp() {
            if (logsAtuais.length === 0) return alert("Nenhum registro hoje.");

            // 1. Mapear usuários únicos que trabalharam hoje para cruzar os dados
            const usuariosTurnos = {};
            logsAtuais.forEach(l => {
                const chaveUser = `${l.nome} ${l.sobrenome}|${l.empresa}|${l.portaria}|${l.turno}`;
                if (!usuariosTurnos[chaveUser]) {
                    usuariosTurnos[chaveUser] = [];
                }
                usuariosTurnos[chaveUser].push(l.hora); // Guarda as horas reais que ele bateu
            });

            // 2. Agrupar por Portaria para manter a estrutura visual anterior
            const portariasAgrupadas = {};
            for (const chaveUser in usuariosTurnos) {
                const [nome, empresa, portaria, turno] = chaveUser.split('|');
                if (!portariasAgrupadas[portaria]) {
                    portariasAgrupadas[portaria] = [];
                }
                portariasAgrupadas[portaria].push({
                    nome, empresa, turno, batidasReais: usuariosTurnos[chaveUser]
                });
            }

            // 3. Cabeçalho da mensagem
            let texto = "*📊 RELATÓRIO DE ACESSOS - NBL LOG*\n";
            texto += "*Data:* " + new Date().toLocaleDateString('pt-BR') + "\n\n";

            // 4. Montar seções estruturadas por Portaria avaliando os horários restritos
            for (const portaria in portariasAgrupadas) {
                texto += `*🚪 PORTARIA: ${portaria.toUpperCase()}*\n`;
                texto += `-----------------------------\n`;
                
                portariasAgrupadas[portaria].forEach(user => {
                    const turnoNorm = (user.turno || "").toUpperCase().trim();
                    const horariosEsperados = HORARIOS_OBRIGATORIOS[turnoNorm] || [];
                    
                    if (horariosEsperados.length === 0) {
                        // Se o turno não estiver mapeado nas regras, exibe as batidas normais dele
                        user.batidasReais.forEach(hora => {
                            texto += `• ${user.nome} | ${hora} - ${user.turno} - ${user.empresa} ✅\n`;
                        });
                    } else {
                        // Cruza a lista de horários obrigatórios do turno com as batidas reais do funcionário
                        horariosEsperados.forEach(horaEsperada => {
                            // Verifica se há alguma batida do funcionário nos mesmos minutos ou hora aproximada
                            const realizouBatida = user.batidasReais.some(horaReal => horaReal.split(':')[0] === horaEsperada.split(':')[0]);
                            
                            if (realizouBatida) {
                                // Pega o horário real registrado (ex: 06:59 em vez do redondo 07:00)
                                const horaExata = user.batidasReais.find(horaReal => horaReal.split(':')[0] === horaEsperada.split(':')[0]);
                                texto += `• ${user.nome} | ${horaExata} - ${user.turno} - ${user.empresa} ✅\n`;
                            } else {
                                // Se não houver registro para aquele horário esperado do turno
                                texto += `• ${user.nome} | ${horaEsperada} - ${user.turno} - ${user.empresa} ❌\n`;
                            }
                        });
                    }
                });
                
                texto += `\n`; 
            }

            // 5. Rodapé e Assinatura fiel solicitada
            texto += "_Gerado automaticamente pelo sistema REFRASH NBL_";
            
            // 6. Enviar para a API do WhatsApp
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        setInterval(carregarLogs, 5000);
        carregarLogs();
    </script>
</body>
</html>
