<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Monitoramento Real-Time | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #002855; --green: #27ae60; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 250px; background: var(--blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .main { margin-left: 250px; padding: 30px; width: calc(100% - 250px); }
        .card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .btn-ws { background: #25D366; color: white; border: none; padding: 12px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; margin-bottom: 20px; display: inline-flex; align-items: center; gap: 10px; text-decoration: none; }
        .btn-ws:hover { background: #1ebd59; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #e1e8ed; }
        th { background: var(--blue); color: white; }
        .badge { background: #e1f5fe; color: #0288d1; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; }
        
        /* Estilos da Sidebar */
        .sidebar h3 { margin-top: 0; margin-bottom: 30px; text-align: center; letter-spacing: 1px; }
        .sidebar a { color: white; text-decoration: none; display: block; padding: 12px; margin-bottom: 10px; border-radius: 8px; background: rgba(255,255,255,0.05); }
        .sidebar a:hover { background: rgba(255,255,255,0.15); }
        .sidebar a.active { background: #4a7ab5; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h3>NBL LOG</h3>
        <a href="/admin">Gestão de Usuários</a>
        <a href="/admin/monitoramento" class="active">Monitoramento</a>
        <a href="/">Sair (Totem)</a>
    </div>

    <div class="main">
        <button class="btn-ws" onclick="enviarRelatorioWhatsapp()">
            <i class="fab fa-whatsapp"></i> Enviar Relatório no WhatsApp
        </button>

        <div class="card">
            <h2>Acessos em Tempo Real (Hoje)</h2>
            <table>
                <thead>
                    <tr>
                        <th>Horário</th>
                        <th>Colaborador</th>
                        <th>Empresa</th>
                        <th>Portaria</th>
                        <th>Turno</th>
                    </tr>
                </thead>
                <tbody id="logs-body">
                    </tbody>
            </table>
        </div>
    </div>

    <script>
        let logsAtuais = [];

        async function carregarLogs() {
            try {
                const res = await fetch('/api/admin/status_realtime');
                const data = await res.json();
                logsAtuais = data;

                const tbody = document.getElementById('logs-body');
                tbody.innerHTML = '';

                data.forEach(l => {
                    tbody.innerHTML += `
                        <tr>
                            <td><strong>${l.hora}</strong></td>
                            <td>${l.nome} ${l.sobrenome}</td>
                            <td>${l.empresa}</td>
                            <td><span class="badge">${l.portaria}</span></td>
                            <td><span class="badge" style="background:#fff3cd; color:#856404;">${l.turno}</span></td>
                        </tr>
                    `;
                });
            } catch (e) { 
                console.error("Erro ao carregar logs", e); 
            }
        }

        function enviarRelatorioWhatsapp() {
            if (logsAtuais.length === 0) return alert("Nenhum registro hoje.");

            // 1. Agrupar os logs por turno
            const turnosAgrupados = {};
            
            logsAtuais.forEach(l => {
                const turnoNome = l.turno || "Não Definido";
                if (!turnosAgrupados[turnoNome]) {
                    turnosAgrupados[turnoNome] = [];
                }
                turnosAgrupados[turnoNome].push(l);
            });

            // 2. Montar cabeçalho da mensagem
            let texto = "*📊 RELATÓRIO DE ACESSOS - NBL LOG*\n";
            texto += "*Data:* " + new Date().toLocaleDateString('pt-BR') + "\n\n";

            // 3. Montar as seções para cada turno separadamente
            for (const turno in turnosAgrupados) {
                texto += `*⏱️ ${turno.toUpperCase()}*\n`;
                texto += `-----------------------------\n`;
                
                turnosAgrupados[turno].forEach(l => {
                    texto += `👤 *Nome:* ${l.nome} ${l.sobrenome}\n`;
                    texto += `🚪 *Portaria:* ${l.portaria}\n`;
                    texto += `🕒 *Horário:* ${l.hora}\n`;
                    texto += `🏢 *Empresa:* ${l.empresa}\n`;
                    texto += `\n`; // Quebra de linha entre colaboradores do mesmo turno
                });
                
                texto += `\n`; // Quebra de linha adicional após finalizar um bloco de turno
            }

            // 4. Rodapé solicitado com a assinatura exata
            texto += "_Gerado automaticamente pelo sistema NBL_";
            
            // 5. Enviar para a API do WhatsApp
            const url = `https://api.whatsapp.com/send?text=${encodeURIComponent(texto)}`;
            window.open(url, '_blank');
        }

        // Atualiza a cada 5 segundos automaticamente
        setInterval(carregarLogs, 5000);
        carregarLogs();
    </script>
</body>
</html>
