<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --nbl-blue: #1C355E; --nbl-red: #E31E24; --bg: #f4f7f9; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; position: relative; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; z-index: 2; }
        select, input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; }
        .main-btn { width: 100%; padding: 15px; background: var(--nbl-blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 18px; }
        
        /* Botão do Modo Totem (Tela Cheia) */
        .btn-totem {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--nbl-blue);
            color: white;
            border: none;
            padding: 12px 16px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            transition: background 0.2s;
            z-index: 10;
        }
        .btn-totem:hover { background: #11223e; }
        .btn-totem.active { background: var(--nbl-red); }
    </style>
</head>
<body>

    <button class="btn-totem" id="totemBtn" onclick="alternarModoTotem()">
        <i class="fas fa-expand"></i> Ativar Modo Totem
    </button>

    <div class="card">
        <h2>PORTARIA NBL LOG</h2>
        <select id="portaria">
            <option value="">Selecione a Portaria</option>
            <option value="P1">Portaria 1</option>
            <option value="P2">Portaria 2</option>
        </select>
        
        <select id="turno">
            <option value="">Selecione o Turno</option>
            <option value="DIURNO">Diurno (07:00 - 19:00)</option>
            <option value="NOTURNO">Noturno (19:00 - 07:00)</option>
        </select>
        
        <input type="text" id="user" placeholder="Usuário / Matrícula">
        <input type="password" id="code" placeholder="Código Numérico" inputmode="numeric">
        <button class="main-btn" onclick="validar()">CONFIRMAR ENTRADA</button>
    </div>

    <script>
        let wakeLock = null;

        // Função para manter a tela do tablet sempre ativa sem apagar
        async function solicitarSinalAtivo() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log("Wake Lock ativo: A tela não irá desligar.");
                } catch (err) {
                    console.warn(`Não foi possível manter a tela ativa: ${err.message}`);
                }
            } else {
                console.log("API Wake Lock não suportada neste navegador.");
            }
        }

        // Libera o bloqueio se sair do modo tela cheia
        function liberarSinalAtivo() {
            if (wakeLock !== null) {
                wakeLock.release();
                wakeLock = null;
                console.log("Wake Lock liberado.");
            }
        }

        // Alternador Inteligente de Modo Totem (Tela Cheia + Tela Ativa)
        function alternarModoTotem() {
            const btn = document.getElementById('totemBtn');
            
            if (!document.fullscreenElement) {
                // Ativa Tela Cheia
                document.documentElement.requestFullscreen()
                    .then(() => {
                        btn.innerHTML = '<i class="fas fa-compress"></i> Sair do Modo Totem';
                        btn.classList.add('active');
                        solicitarSinalAtivo(); // Trava a tela ativa
                    })
                    .catch(err => {
                        alert(`Erro ao tentar aplicar tela cheia: ${err.message}`);
                    });
            } else {
                // Sai da Tela Cheia
                document.exitFullscreen();
            }
        }

        // Monitora mudanças na tela cheia (caso o usuário saia usando o botão padrão do tablet)
        document.addEventListener('fullscreenchange', () => {
            const btn = document.getElementById('totemBtn');
            if (!document.fullscreenElement) {
                btn.innerHTML = '<i class="fas fa-expand"></i> Ativar Modo Totem';
                btn.classList.remove('active');
                liberarSinalAtivo(); // Libera o tablet para apagar se necessário
            }
        });

        // Reaplica o bloqueio automaticamente se o app perder o foco e voltar
        document.addEventListener('visibilitychange', async () => {
            if (wakeLock !== null && document.visibilityState === 'visible') {
                await solicitarSinalAtivo();
            }
        });

        // Envio dos dados para validação
        async function validar() {
            const payload = {
                usuario: document.getElementById('user').value.trim(),
                codigo: document.getElementById('code').value.trim(),
                turno: document.getElementById('turno').value,
                portaria: document.getElementById('portaria').value
            };

            if (!payload.usuario || !payload.codigo || !payload.portaria || !payload.turno) {
                return alert("Por favor, preencha todos os campos.");
            }

            try {
                const res = await fetch('/api/colaborador/validar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await res.json();
                alert(data.msg);
                if (res.ok) {
                    document.getElementById('code').value = '';
                    document.getElementById('user').value = '';
                }
            } catch (e) {
                alert("Erro de conexão com o servidor.");
            }
        }
    </script>
</body>
</html>
