<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Admin | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #002855; --red: #E31E24; --bg: #f0f3f6; --success: #27ae60; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 260px; background: var(--blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .main { margin-left: 260px; padding: 30px; width: calc(100% - 260px); }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; margin-bottom: 20px; }
        .btn-action { border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; color: white; margin-right: 5px; }
        .btn-pdf { background: var(--red); }
        .btn-excel { background: var(--success); }
        .btn-whatsapp { background: #25d366; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>NBL LOG</h2>
        <button onclick="location.href='/'" style="width:100%;">Voltar ao Totem</button>
    </div>

    <div class="main">
        <div class="card">
            <h3>Gerar Relatórios</h3>
            <div class="grid-form">
                <input type="date" id="rel_inicio">
                <input type="date" id="rel_fim">
                <select id="rel_turno">
                    <option value="Todos">Todos os Turnos</option>
                    <option value="ADM">ADM</option>
                    <option value="Turno A">Turno A</option>
                    <option value="Turno B">Turno B</option>
                    <option value="Turno C">Turno C</option>
                </select>
            </div>
            <button onclick="exportar('pdf')" class="btn-action btn-pdf">PDF</button>
            <button onclick="exportar('excel')" class="btn-action btn-excel">EXCEL</button>
        </div>

        <div class="card">
            <div style="display:flex; justify-content:space-between;">
                <h3>Monitoramento P1 e P2</h3>
                <button onclick="enviarWhatsapp()" class="btn-action btn-whatsapp">Enviar WhatsApp</button>
            </div>
            <div style="display:grid; grid-template-columns: 1fr 1fr; gap:20px;">
                <div><h4>P1</h4><table id="bodyP1"></table></div>
                <div><h4>P2</h4><table id="bodyP2"></table></div>
            </div>
        </div>
    </div>

    <script>
        function exportar(fmt) {
            const ini = document.getElementById('rel_inicio').value;
            const fim = document.getElementById('rel_fim').value;
            const t = document.getElementById('rel_turno').value;
            if(!ini || !fim) return alert("Selecione as datas.");
            window.open(`/admin/exportar/${fmt}?inicio=${ini}&fim=${fim}&turno=${t}`, '_blank');
        }

        async function carregar() {
            const res = await fetch('/admin/status_realtime');
            const logs = await res.json();
            const p1 = document.getElementById('bodyP1');
            const p2 = document.getElementById('bodyP2');
            p1.innerHTML = ''; p2.innerHTML = '';
            logs.forEach(l => {
                const tr = `<tr><td><b>${l.nome}</b><br>${l.empresa}</td><td>${l.hora}</td></tr>`;
                if(l.portaria === 'P1') p1.innerHTML += tr; else p2.innerHTML += tr;
            });
        }

        function enviarWhatsapp() {
            const fone = "55919XXXXXXXX"; // Configure seu número
            let msg = "*📋 RELATÓRIO NBL LOG*\n\n";
            document.querySelectorAll('tr').forEach(r => {
                if(r.innerText.includes('P1') || r.innerText.includes('P2')) return;
                msg += "✅ " + r.innerText.replace(/\n/g, " ") + "\n";
            });
            window.open(`https://api.whatsapp.com/send?phone=${fone}&text=${encodeURIComponent(msg)}`, '_blank');
        }

        carregar();
        setInterval(carregar, 30000);
    </script>
</body>
</html>
