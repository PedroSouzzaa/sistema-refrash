<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Usuários | NBL LOG</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --blue: #002855; --red: #E31E24; --bg: #f0f3f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; display: flex; }
        .sidebar { width: 260px; background: var(--blue); color: white; height: 100vh; position: fixed; padding: 20px; box-sizing: border-box; }
        .nav-btn { width: 100%; padding: 12px; margin-bottom: 10px; border: none; border-radius: 8px; background: rgba(255,255,255,0.1); color: white; cursor: pointer; text-align: left; }
        .nav-btn.active { background: #4a7ab5; }
        .main { margin-left: 260px; padding: 30px; width: calc(100% - 260px); }
        .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .grid-form { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 6px; }
        .btn-primary { background: var(--blue); color: white; border: none; padding: 12px 25px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
        .badge { background: #e1e8f0; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>NBL LOG</h2>
        <button class="nav-btn" onclick="location.href='/admin'"><i class="fas fa-chart-line"></i> Monitoramento</button>
        <button class="nav-btn active" onclick="location.href='/admin/usuarios'"><i class="fas fa-users"></i> Gestão de Usuários</button>
    </div>

    <div class="main">
        <div class="card">
            <h3>Cadastrar Novo Colaborador</h3>
            <div class="grid-form">
                <input type="text" id="nome" placeholder="Nome">
                <input type="text" id="sobrenome" placeholder="Sobrenome">
                <input type="text" id="usuario_login" placeholder="Login / Matrícula">
                <input type="text" id="codigo_acesso" placeholder="Código Numérico" inputmode="numeric" oninput="this.value = this.value.replace(/[^0-9]/g, '')">
                <input type="text" id="empresa" placeholder="Empresa">
                <input type="text" id="sede" placeholder="Sede">
            </div>
            <button onclick="salvarUsuario()" class="btn-primary">Salvar Usuário</button>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th>Nome</th>
                        <th>Login</th>
                        <th>Cód. Acesso</th>
                        <th>Empresa</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody id="tabelaUsuarios"></tbody>
            </table>
        </div>
    </div>

    <script>
        async function listar() {
            const res = await fetch('/api/usuarios/listar');
            const data = await res.json();
            const tbody = document.getElementById('tabelaUsuarios');
            tbody.innerHTML = '';
            data.forEach(u => {
                tbody.innerHTML += `
                    <tr>
                        <td><b>${u.nome} ${u.sobrenome}</b></td>
                        <td>${u.usuario_login}</td>
                        <td><span class="badge">${u.codigo_acesso || '---'}</span></td>
                        <td>${u.empresa}</td>
                        <td><button onclick="excluir('${u.usuario_login}')" style="color:red; cursor:pointer; background:none; border:none;"><i class="fas fa-trash"></i></button></td>
                    </tr>`;
            });
        }

        async function salvarUsuario() {
            const payload = {
                nome: document.getElementById('nome').value,
                sobrenome: document.getElementById('sobrenome').value,
                usuario_login: document.getElementById('usuario_login').value,
                codigo_acesso: document.getElementById('codigo_acesso').value,
                empresa: document.getElementById('empresa').value,
                sede: document.getElementById('sede').value
            };
            if(!payload.nome || !payload.usuario_login || !payload.codigo_acesso) return alert("Preencha Nome, Login e Código.");
            await fetch('/api/usuarios/salvar', { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload) });
            document.querySelectorAll('input').forEach(i => i.value = '');
            listar();
        }

        async function excluir(login) {
            if(confirm("Deseja excluir?")) {
                await fetch(`/api/usuarios/excluir/${login}`, { method: 'DELETE' });
                listar();
            }
        }
        listar();
    </script>
</body>
</html>
